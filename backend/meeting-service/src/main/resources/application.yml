server:
  port: 8086

spring:
  application:
    name: meeting-service
  datasource:
    url: jdbc:postgresql://localhost:5432/internship_meeting_db
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
